name: CI

on:
  push:
    branches: [main]
  # edited も対象: pr-policy は PR タイトルを検査するため、タイトル変更でも再検査が要る
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 依存を導入
        run: pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check .

      - name: 型チェック (mypy)
        run: mypy src

      # データリポジトリを取りに行くテストは置かない。ここで検査するのは
      # 「データがこう来たらこう扱う」であって、データそのものではない。
      - name: テスト (pytest)
        run: pytest -q

      - name: シェルスクリプトの構文
        run: bash -n scripts/*.sh

  # squash merge では PR タイトルがそのまま main のコミットメッセージになるため、
  # マージ前に形式を強制する。
  pr-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v7

      - name: 判定スクリプト自体のテスト
        run: ./scripts/test-check-pr-title.sh

      - name: PR タイトルの Conventional Commits lint
        run: ./scripts/check-pr-title.sh
